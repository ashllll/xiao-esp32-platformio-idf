                - paragraph [ref=e208]: Do not remove the screen when soldering the pin headers. Tilt the soldering iron and solder the headers directly.
              - generic [ref=e209]:
                - generic [ref=e210]: Note
                - generic [ref=e214]:
                  - paragraph [ref=e215]: Keep the screen brightness at 50% or lower during use, and do not operate the screen at full brightness for extended periods. Excessive brightness increases the screen temperature, and overheating may cause dark shadows on the screen and affect normal display.
                  - paragraph [ref=e216]: If the display is already abnormal, allow the development board to cool down, then flash a program with a lower brightness setting.
              - heading [level=2] [ref=e217]:
                - text: Product Overview
                - link "Direct link to Product Overview" [ref=e218] [cursor=pointer]:
                  - /url: "#product-overview"
                  - text: "#"
              - paragraph [ref=e219]: The ESP32-C6-LCD-1.47 is a microcontroller development board that supports 2.4 GHz Wi-Fi 6 and BLE 5. It integrates 4 MB Flash and has onboard 1.47-inch LCD screen, can smoothly run GUI programs such as LVGL. Combined with various peripheral interfaces, it is suitable for the quick development of the HMI and other ESP32-C6 applications.
              - table [ref=e220]:
                - rowgroup [ref=e221]:
                  - row [ref=e222]:
                    - columnheader "SKU" [ref=e223]
                    - columnheader "Product" [ref=e224]
                - rowgroup [ref=e225]:
