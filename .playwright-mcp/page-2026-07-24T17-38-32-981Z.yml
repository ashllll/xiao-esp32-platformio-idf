                    - cell "ESP32-C6-LCD-1.47-M" [ref=e231]
              - heading [level=2] [ref=e232]:
                - text: Features
                - link "Direct link to Features" [ref=e233] [cursor=pointer]:
                  - /url: "#features"
                  - text: "#"
              - list [ref=e234]:
                - listitem [ref=e235]: Equipped with a high-performance RISC-V 32-bit processor and a low-power RISC-V 32-bit processor; the high-performance processor clock is up to 160 MHz and the low-power processor clock is up to 20 MHz
                - listitem [ref=e236]: Supports 2.4 GHz Wi-Fi 6 (802.11 ax/b/g/n) and Bluetooth 5 (BLE), with onboard antenna
                - listitem [ref=e237]: Onboard 320 KB ROM, 512 KB HP SRAM, 16 KB LP SRAM, and 4 MB flash
                - listitem [ref=e238]: Onboard 1.47-inch LCD screen, 172 × 320 resolution, 262K colors
                - listitem [ref=e239]: Most GPIOs are broken out, and full-speed USB serial port is integrated
                - listitem [ref=e240]: Onboard TF card slot for external TF card storage of images or files
                - listitem [ref=e241]: Supports flexible clock control and various power modes for low-power scenarios
                - listitem [ref=e242]: Onboard RGB color LED, which works together with the transparent acrylic interlayer to create cool lighting effects
