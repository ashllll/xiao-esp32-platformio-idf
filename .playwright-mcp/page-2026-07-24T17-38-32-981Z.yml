              - generic [ref=e363]:
                - generic [ref=e364]: Note
                - generic [ref=e368]:
                  - paragraph [ref=e369]: Keep the screen brightness at 50% or lower during use, and do not operate the screen at full brightness for extended periods. Excessive brightness increases the screen temperature, and overheating may cause dark shadows on the screen and affect normal display.
                  - paragraph [ref=e370]: If the display is already abnormal, allow the development board to cool down, then flash a program with a lower brightness setting.
              - paragraph [ref=e371]: "The ESP32-C6-LCD-1.47 supports two development frameworks: Arduino IDE and ESP-IDF, offering flexibility for developers. You can choose the appropriate development tool based on project requirements and personal preference."
              - paragraph [ref=e372]: Arduino generally offers a gentler learning curve and may be more approachable for beginners and hobbyists. ESP-IDF provides advanced tooling and finer control over system behavior, making it better suited to complex projects and applications with demanding performance requirements.
              - list [ref=e373]:
                - listitem [ref=e374]:
                  - paragraph [ref=e375]:
                    - strong [ref=e376]: Arduino IDE
                    - text: is a convenient, flexible, and easy-to-use open-source electronics prototyping platform. It requires minimal foundational knowledge, allowing for rapid development after a short learning period. Arduino has a huge global user community, providing a vast amount of open-source code, project examples, and tutorials, as well as a rich library ecosystem that encapsulates complex functions, enabling developers to implement various features rapidly. You can refer to the
                    - strong [ref=e377]:
                      - link "Working with Arduino" [ref=e378] [cursor=pointer]:
                        - /url: /ESP32-C6-LCD-1.47/Development-Environment-Setup-Arduino
                    - text: to complete the initial setup, and the tutorial also provides related example programs for reference.
                - listitem [ref=e379]:
                  - paragraph [ref=e380]:
                    - strong [ref=e381]: ESP-IDF
                    - text: ", short for Espressif IoT Development Framework, is a professional development framework launched by Espressif Systems for its ESP series of chips. It is based on C language development and includes compilers, debuggers, flashing tools, etc. It supports development via command line or integrated development environments (such as Visual Studio Code with the Espressif IDF plugin), which provides features like code navigation, project management, and debugging. We recommend using VS Code for development. For the specific configuration process, please refer to the"
                    - strong [ref=e382]:
                      - link "Working with ESP-IDF" [ref=e383] [cursor=pointer]:
                        - /url: /ESP32-C6-LCD-1.47/Development-Environment-Setup-ESP-IDF
                    - text: . The tutorial also provides relevant example programs for reference.
