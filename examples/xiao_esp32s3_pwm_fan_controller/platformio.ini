[platformio]
default_envs = xiao_esp32s3
src_dir = main

[env:xiao_esp32s3]
platform = espressif32@7.0.1
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig-xiao_esp32s3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.xiao-esp32s3"
build_flags =
    -D XIAO_ESP32S3=1
